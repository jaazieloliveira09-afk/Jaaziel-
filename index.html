
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aventura Pixel</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-container">
    <h1>Aventura Pixel</h1>
    <p>Explore, pule e encontre o tesouro!</p>

    <div class="game-info">
      <span>Moedas: <strong id="score">0</strong></span>
      <span>Fase: <strong id="level">1</strong></span>
    </div>

    <canvas id="game" width="800" height="420"></canvas>

    <div class="controls">
      <button id="left" aria-label="Mover para esquerda">◀</button>
      <button id="jump">PULAR ▲</button>
      <button id="right" aria-label="Mover para direita">▶</button>
    </div>

    <p id="message">Use as setas ou os botões para jogar!</p>
    <button id="restart">Recomeçar</button>
  </main>

  <script src="main.js"></script>
</body>
</html>
